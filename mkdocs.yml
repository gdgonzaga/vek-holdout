site_name: "Vek: Holdout — Architecture"
site_description: "Architecture docs for Vek: Holdout, a Godot voxel base-building game"
site_author: gdgonzaga
docs_dir: docs/architecture
site_dir: site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: amber
  icon:
    repo: fontawesome/brands/github

nav:
  - "Architecture — Vek: Holdout": index.md
  - Overview: overview.md
  - Subsystems:
    - Core: core.md
    - "Save / Load": save.md
    - "Voxel / World": voxel-world.md
    - Player: player.md
    - Build: build.md
    - "Actions & Interaction": actions.md
    - "Functional Rooms": functional-rooms.md
    - Colonists: colonists.md
    - Jobs: jobs.md
    - Skills: skills.md
    - Maps: maps.md
    - "Map Editor": map-editor.md
    - Expeditions: expeditions.md
    - Inventory: inventory.md
    - Crafting: crafting.md
    - Farming: farming.md
    - UI: ui.md
    - "Game Log": game-log.md
  - Reference:
    - "Data Schemas": data-schemas.md
  - Tracking:
    - "Tech Debt & Unimplemented": tech-debt.md
  - Planned:
    - Combat: combat.md
    - "Equipment & Loadouts": equipment.md
    - Energy: energy.md
    - "Permadeath & Memorial": permadeath-memorial.md
    - Raids: raids.md
    - Loot: loot.md
    - "Debug Console": debug-console.md
    - "Debug Commands": debug-commands.md
    - "Open world": open-world.md
    - "Job system extensions": job-extensions.md
  - About:
    - "Adding a page": contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
