site_name: "Vek: Holdout — Architecture"
site_description: "Architecture docs for Vek: Holdout, a Godot voxel base-building game"
site_author: gdgonzaga
docs_dir: docs/
site_dir: site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: amber
  icon:
    repo: fontawesome/brands/github

nav:
  - "Architecture — Vek: Holdout": architecture/index.md
  - Overview: architecture/overview.md
  - Subsystems:
    - Core: architecture/core.md
    - "Save / Load": architecture/save.md
    - "Voxel / World": architecture/voxel-world.md
    - Player: architecture/player.md
    - Build: architecture/build.md
    - "Actions & Interaction": architecture/actions.md
    - "Functional Rooms": architecture/functional-rooms.md
    - Colonists: architecture/colonists.md
    - Jobs: architecture/jobs.md
    - Skills: architecture/skills.md
    - Maps: architecture/maps.md
    - "Map Editor": architecture/map-editor.md
    - Expeditions: architecture/expeditions.md
    - Inventory: architecture/inventory.md
    - Crafting: architecture/crafting.md
    - Farming: architecture/farming.md
    - UI: architecture/ui.md
    - "Game Log": architecture/game-log.md
  - Reference:
    - "Data Schemas": architecture/data-schemas.md
  - Tracking:
    - "Tech Debt & Unimplemented": architecture/tech-debt.md
  - Planned:
    - Combat: architecture/combat.md
    - "Equipment & Loadouts": architecture/equipment.md
    - Energy: architecture/energy.md
    - "Permadeath & Memorial": architecture/permadeath-memorial.md
    - Raids: architecture/raids.md
    - Loot: architecture/loot.md
    - "Debug Console": architecture/debug-console.md
    - "Debug Commands": architecture/debug-commands.md
    - "Open world": architecture/open-world.md
    - "Job system extensions": architecture/job-extensions.md
  - How tos:
    - "Authoring Blocks": HOWTO-author-blocks.md
    - "Authoring Crops": HOWTO-author-crops.md
    - "Authoring Interactions": HOWTO-author-interactions.md
    - "Authoring Maps": HOWTO-author-maps.md
    - "Transferring Animpic models": HOWTO-transfer-animpic-models.md
  - About:
    - "Adding a page": architecture/contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
